name: Build and release SWORD from TXT sources

on:
  push:
    branches:
      - main
    paths:
      - sources/Vechiul_Testament_UTF8.txt
      - sources/Noul_Testament_UTF8.txt

  workflow_dispatch:
    inputs:
      publish_release:
        description: Publică și un GitHub Release?
        required: true
        default: false
        type: boolean

      replace_existing_release:
        description: Înlocuiește Release-ul dacă versiunea există deja?
        required: true
        default: false
        type: boolean

concurrency:
  group: sword-build-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  MODULE_ID: ROOrthodox_exp
  MODULE_SLUG: roorthodox_exp
  VT_TXT_PATH: sources/Vechiul_Testament_UTF8.txt
  NT_TXT_PATH: sources/Noul_Testament_UTF8.txt
  OSIS_BUILDER_PATH: scripts/build_biblia_osis.py
  XML_PATH: build/generated/biblia.xml
  MODULE_CONF_PATH: mods.d/roorthodox_exp.conf
  SWORD_ROOT: build/sword
  LOG_DIR: build/logs
  RELEASE_ARCHIVE: roorthodox_exp-sword.zip

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsword-utils \
            diatheke \
            libxml2-utils \
            zip

      - name: Validate sources and configuration
        run: |
          for REQUIRED_FILE in \
            "$VT_TXT_PATH" \
            "$NT_TXT_PATH" \
            "$OSIS_BUILDER_PATH" \
            "$MODULE_CONF_PATH"
          do
            test -f "$REQUIRED_FILE" || {
              echo "Missing required file: $REQUIRED_FILE"
              exit 1
            }
          done

          python -m py_compile "$OSIS_BUILDER_PATH"

          FIRST_LINE="$(head -n 1 "$MODULE_CONF_PATH" | tr -d '\r')"
          EXPECTED_DATA_PATH="DataPath=./modules/texts/ztext/${MODULE_SLUG}/"
          MODULE_VERSION="$(sed -n 's/^Version=//p' "$MODULE_CONF_PATH" | head -n 1 | tr -d '\r')"

          if [[ "$FIRST_LINE" != "[$MODULE_ID]" ]]; then
            echo "Expected module identifier [$MODULE_ID], found: $FIRST_LINE"
            exit 1
          fi

          if ! grep -Fxq "$EXPECTED_DATA_PATH" "$MODULE_CONF_PATH"; then
            echo "Incorrect or missing DataPath."
            echo "Expected: $EXPECTED_DATA_PATH"
            exit 1
          fi

          if ! grep -Fxq 'Versification=Orthodox' "$MODULE_CONF_PATH"; then
            echo "Expected Versification=Orthodox"
            exit 1
          fi

          if [[ ! "$MODULE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Invalid or missing Version: $MODULE_VERSION"
            echo "Use a numeric version such as 1.0, 1.1 or 1.1.1."
            exit 1
          fi

          {
            echo "MODULE_VERSION=$MODULE_VERSION"
            echo "RELEASE_TAG=v$MODULE_VERSION"
            echo "MODULE_DATA_PATH=$SWORD_ROOT/modules/texts/ztext/$MODULE_SLUG"
            echo "CONF_TARGET=$SWORD_ROOT/mods.d/$MODULE_SLUG.conf"
          } >> "$GITHUB_ENV"

      - name: Check release version policy
        id: release_policy
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPLACE_REQUESTED: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.replace_existing_release }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG does not exist."
            echo "replace=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release $RELEASE_TAG already exists."

          if [ "$EVENT_NAME" = "push" ]; then
            echo "::error::Release $RELEASE_TAG already exists."
            echo "::error::Increase Version= in $MODULE_CONF_PATH before pushing TXT changes."
            exit 1
          fi

          if [ "$REPLACE_REQUESTED" != "true" ]; then
            echo "::error::Release $RELEASE_TAG already exists."
            echo "::error::Increase Version= or run manually with replacement enabled."
            exit 1
          fi

          echo "::warning::Release $RELEASE_TAG will be replaced after a successful build."
          echo "replace=true" >> "$GITHUB_OUTPUT"

      - name: Prepare build folders
        run: |
          rm -rf build
          mkdir -p \
            build/generated \
            "$SWORD_ROOT/mods.d" \
            "$SWORD_ROOT/modules/texts/ztext/$MODULE_SLUG" \
            "$LOG_DIR"

      - name: Generate combined OSIS from TXT
        run: |
          python "$OSIS_BUILDER_PATH" \
            --vt-input "$VT_TXT_PATH" \
            --nt-input "$NT_TXT_PATH" \
            --output "$XML_PATH" \
            2>&1 | tee "$LOG_DIR/txt-to-osis.log"

          xmllint --noout "$XML_PATH"

      - name: Build SWORD module
        run: |
          osis2mod \
            "$MODULE_DATA_PATH" \
            "$XML_PATH" \
            -z z \
            -b 4 \
            -v Orthodox \
            2>&1 | tee "$LOG_DIR/osis2mod.log"

      - name: Prepare module configuration
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%d')"
          cp "$MODULE_CONF_PATH" "$CONF_TARGET"

          if grep -q '^SwordVersionDate=' "$CONF_TARGET"; then
            sed -i -E \
              "s/^SwordVersionDate=.*/SwordVersionDate=${BUILD_DATE}/" \
              "$CONF_TARGET"
          else
            printf '\nSwordVersionDate=%s\n' "$BUILD_DATE" >> "$CONF_TARGET"
          fi

          echo "Generated configuration summary:"
          grep -E '^(Version|SwordVersionDate|DataPath|Versification)=' "$CONF_TARGET"

      - name: Verify generated module files
        run: |
          FILE_COUNT="$(find "$MODULE_DATA_PATH" -type f | wc -l)"

          if (( FILE_COUNT == 0 )); then
            echo "osis2mod did not generate any module files."
            exit 1
          fi

          echo "Generated module files: $FILE_COUNT"
          du -sh "$MODULE_DATA_PATH"

      - name: Test module with Diatheke
        run: |
          export SWORD_PATH="$GITHUB_WORKSPACE/$SWORD_ROOT"

          diatheke -b system -k modulelist \
            2>&1 | tee "$LOG_DIR/module-list.log"

          if ! grep -Fqi "$MODULE_ID" "$LOG_DIR/module-list.log"; then
            echo "Module $MODULE_ID was not detected by the SWORD engine."
            exit 1
          fi

          diatheke \
            -b "$MODULE_ID" \
            -f plain \
            -e UTF8 \
            -k 'Gen 1:1' \
            2>&1 | tee "$LOG_DIR/smoke-test.log"

          test -s "$LOG_DIR/smoke-test.log" || {
            echo "The smoke test returned no output."
            exit 1
          }

      - name: Create installable SWORD ZIP
        run: |
          (
            cd "$SWORD_ROOT"
            zip -qr "../$RELEASE_ARCHIVE" mods.d modules
          )

          zip -T "build/$RELEASE_ARCHIVE"
          sha256sum "build/$RELEASE_ARCHIVE" > "build/$RELEASE_ARCHIVE.sha256"

      - name: Upload installable module
        uses: actions/upload-artifact@v7
        with:
          path: build/${{ env.RELEASE_ARCHIVE }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sword-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.LOG_DIR }}/
            ${{ env.XML_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove existing release for manual replacement
        if: >-
          ${{
            success()
            && github.event_name == 'workflow_dispatch'
            && inputs.publish_release
            && steps.release_policy.outputs.replace == 'true'
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Removing existing release and tag: $RELEASE_TAG"
          gh release delete "$RELEASE_TAG" \
            --cleanup-tag \
            --yes

      - name: Create GitHub Release
        if: >-
          ${{
            success()
            && (
              github.event_name == 'push'
              || inputs.publish_release
            )
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "build/$RELEASE_ARCHIVE" \
            "build/$RELEASE_ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Release $MODULE_VERSION" \
            --notes "SWORD module generated automatically from the UTF-8 TXT sources." \
            --latest
