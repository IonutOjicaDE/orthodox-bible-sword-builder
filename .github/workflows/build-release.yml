name: Build and release SWORD on XML update

on:
  push:
    branches:
      - main
    paths:
      - 'sources/biblia.xml'

  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publică și un GitHub Release?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  MODULE_ID: ROOrthodox_exp
  XML_PATH: sources/biblia.xml
  MODULE_CONF_PATH: mods.d/roorthodox_exp.conf

  SWORD_ROOT: build/sword
  MODULE_DATA_PATH: build/sword/modules/texts/ztext/roorthodox_exp
  LOG_DIR: build/logs

  RELEASE_ARCHIVE: roorthodox_exp-sword.zip

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install SWORD and archive tools
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libsword-utils \
            diatheke \
            zip \
            unzip

          echo "Installed SWORD tools:"
          command -v osis2mod
          command -v diatheke
          osis2mod --help 2>&1 | head -n 5 || true
          diatheke 2>&1 | head -n 10 || true

      - name: Validate source files and configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -f "$XML_PATH" ]; then
            echo "Missing XML file: $XML_PATH"
            exit 1
          fi

          if [ ! -f "$MODULE_CONF_PATH" ]; then
            echo "Missing module conf file: $MODULE_CONF_PATH"
            exit 1
          fi

          if ! grep -Fxq "[$MODULE_ID]" "$MODULE_CONF_PATH"; then
            echo "The module identifier [$MODULE_ID] was not found."
            exit 1
          fi

          EXPECTED_DATA_PATH='DataPath=./modules/texts/ztext/roorthodox_exp/'

          if ! grep -Fxq "$EXPECTED_DATA_PATH" "$MODULE_CONF_PATH"; then
            echo "Incorrect or missing DataPath."
            echo "Expected: $EXPECTED_DATA_PATH"
            exit 1
          fi

      - name: Prepare build folders
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf build

          mkdir -p "$MODULE_DATA_PATH"
          mkdir -p "$SWORD_ROOT/mods.d"
          mkdir -p "$LOG_DIR"

      - name: Build SWORD module and capture log
        shell: bash
        run: |
          set -Eeuo pipefail

          osis2mod \
            "$MODULE_DATA_PATH" \
            "$XML_PATH" \
            -z z \
            -b 4 \
            -v Orthodox \
            2>&1 | tee "$LOG_DIR/osis2mod.log"

      - name: Copy and version module configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          CONF_TARGET="$SWORD_ROOT/mods.d/roorthodox_exp.conf"
          MODULE_VERSION="1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          BUILD_DATE="$(date -u +'%Y-%m-%d')"

          cp "$MODULE_CONF_PATH" "$CONF_TARGET"

          sed -i -E \
            "s/^Version=.*/Version=${MODULE_VERSION}/" \
            "$CONF_TARGET"

          if grep -q '^SwordVersionDate=' "$CONF_TARGET"; then
            sed -i -E \
              "s/^SwordVersionDate=.*/SwordVersionDate=${BUILD_DATE}/" \
              "$CONF_TARGET"
          else
            printf '\nSwordVersionDate=%s\n' "$BUILD_DATE" >> "$CONF_TARGET"
          fi

          echo "MODULE_VERSION=$MODULE_VERSION" >> "$GITHUB_ENV"

          echo "Generated configuration:"
          cat "$CONF_TARGET"

      - name: Inspect generated files
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Generated SWORD structure:"
          find "$SWORD_ROOT" -type f -print | sort

          if ! find "$MODULE_DATA_PATH" -type f -print -quit | grep -q .; then
            echo "osis2mod did not generate any module files."
            exit 1
          fi

      - name: Test module with Diatheke
        shell: bash
        run: |
          set -Eeuo pipefail

          export SWORD_PATH="$GITHUB_WORKSPACE/$SWORD_ROOT"

          echo "SWORD_PATH=$SWORD_PATH"
          echo "Available configuration files:"
          find "$SWORD_PATH/mods.d" -maxdepth 1 -type f -print

          echo "Modules detected by SWORD:"
          diatheke -b system -k modulelist \
            2>&1 | tee "$LOG_DIR/module-list.log"

          if ! grep -Fqi "$MODULE_ID" "$LOG_DIR/module-list.log"; then
            echo "ERROR: Module $MODULE_ID was not detected by the SWORD engine."
            echo "Contents of the generated configuration:"
            cat "$SWORD_PATH/mods.d/roorthodox_exp.conf"
            exit 1
          fi

          echo "Testing Genesis 1:1:"
          diatheke \
            -b "$MODULE_ID" \
            -f plain \
            -e UTF8 \
            -k "Gen 1:1" \
            2>&1 | tee "$LOG_DIR/smoke-test.log"

          if [ ! -s "$LOG_DIR/smoke-test.log" ]; then
            echo "ERROR: The smoke test returned no output."
            exit 1
          fi

      - name: Create installable SWORD ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          (
            cd "$SWORD_ROOT"
            zip -r "../$RELEASE_ARCHIVE" mods.d modules
          )

          echo "Archive contents:"
          unzip -l "build/$RELEASE_ARCHIVE"

      - name: Upload installable module
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: build/${{ env.RELEASE_ARCHIVE }}
          archive: false
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sword-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.LOG_DIR }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="xml-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"

          gh release create "$TAG" \
            "build/$RELEASE_ARCHIVE" \
            --title "ROOrthodox experimental ${MODULE_VERSION}" \
            --notes "SWORD module generated automatically from sources/biblia.xml."
